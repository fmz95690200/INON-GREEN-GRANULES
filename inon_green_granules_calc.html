<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>原料換算 INON GREEN GRANULES</title>
<style>
  :root{
    --ink:#1f2a24;
    --paper:#f6f4ee;
    --line:#c9c2b2;
    --accent:#3f6b4a;
    --accent-dark:#2c4d34;
    --accent2:#6b4a3f;
    --accent2-dark:#4d332c;
    --danger:#8a3b2b;
    --danger-dark:#6e2e21;
    --cell:#ffffff;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    font-family:"Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif;
    background:var(--paper);
    color:var(--ink);
    padding:20px 12px 60px;
  }
  .wrap{
    max-width:640px;
    margin:0 auto;
  }

  /* ---------- 標題 ---------- */
  .title-cn{
    font-size:1.5rem;
    font-weight:700;
    letter-spacing:0.06em;
    margin:0;
  }
  .title-en{
    font-size:1rem;
    font-weight:600;
    letter-spacing:0.08em;
    color:#5b5346;
    margin:2px 0 10px;
  }
  .products-sub{
    display:flex;
    flex-direction:column;
    gap:2px;
    font-size:0.82rem;
    color:#4a4438;
    border-top:1px solid var(--line);
    border-bottom:1px solid var(--line);
    padding:8px 0;
    margin-bottom:18px;
  }
  .products-sub span::before{
    content:"● ";
    color:var(--accent);
  }

  /* ---------- 清除鍵 ---------- */
  .fixed-clear{
    position:fixed;
    top:14px;
    right:14px;
    z-index:10;
  }
  @media (max-width:480px){
    .fixed-clear{position:static;display:block;text-align:right;margin-bottom:10px;}
  }

  button{
    font-size:0.9rem;
    padding:9px 16px;
    border-radius:5px;
    border:none;
    cursor:pointer;
    font-weight:600;
  }
  .btn-primary{background:var(--accent);color:#fff;}
  .btn-primary:hover{background:var(--accent-dark);}
  .btn-primary2{background:var(--accent2);color:#fff;}
  .btn-primary2:hover{background:var(--accent2-dark);}
  .btn-clear{background:var(--danger);color:#fff;}
  .btn-clear:hover{background:var(--danger-dark);}
  .btn-calc{
    background:var(--ink);
    color:#fff;
    width:100%;
    padding:12px;
    font-size:1rem;
  }
  .btn-calc:hover{background:#000;}

  /* ---------- 產品卡片 ---------- */
  .product-card{
    background:var(--cell);
    border:1px solid var(--line);
    border-radius:6px;
    padding:16px 14px 18px;
    margin-bottom:16px;
  }
  .product-card.p1{border-left:4px solid var(--accent);}
  .product-card.p2{border-left:4px solid var(--accent2);}

  .product-card h2{
    font-size:1rem;
    margin:0 0 4px;
  }
  .p1 h2{color:var(--accent-dark);}
  .p2 h2{color:var(--accent2-dark);}

  /* ---------- 公式顯示 ---------- */
  .formula{
    display:flex;
    align-items:center;
    flex-wrap:wrap;
    gap:6px;
    font-size:0.95rem;
    background:#fbfaf5;
    border:1px dashed var(--line);
    border-radius:5px;
    padding:10px 12px;
    margin:10px 0 14px;
  }
  .frac{
    display:inline-flex;
    flex-direction:column;
    align-items:center;
    vertical-align:middle;
    font-size:0.85rem;
    line-height:1.3;
  }
  .frac .num{
    border-bottom:1.4px solid var(--ink);
    padding:0 6px 2px;
  }
  .frac .den{
    padding:2px 6px 0;
  }

  /* ---------- Y 輸入 ---------- */
  .step{
    display:flex;
    align-items:flex-end;
    gap:10px;
    flex-wrap:wrap;
    margin-bottom:14px;
  }
  .step label{
    display:block;
    font-size:0.85rem;
    margin-bottom:4px;
    white-space:nowrap;
  }
  .step input[type=number]{
    width:90px;
    padding:7px 8px;
    border:1px solid var(--line);
    border-radius:4px;
    font-size:0.95rem;
  }

  /* ---------- 動態值組 ---------- */
  .groups{
    display:flex;
    flex-direction:column;
    gap:8px;
    margin-bottom:6px;
  }
  .group-row{
    background:#fbfaf5;
    border:1px dashed var(--line);
    border-radius:5px;
    padding:8px 8px 4px;
  }
  .group-row .g-label{
    font-size:0.75rem;
    font-weight:600;
    color:#6b6455;
    margin-bottom:4px;
  }
  .group-row.is-last .g-label{color:var(--danger-dark);}

  .g-grid{
    display:grid;
    gap:6px;
  }
  .g-grid.cols-3{grid-template-columns:repeat(3,1fr);}
  .g-grid.cols-2{grid-template-columns:repeat(2,1fr);}

  .g-cell label{
    display:block;
    font-size:0.68rem;
    white-space:nowrap;
    color:#4a4438;
    margin-bottom:2px;
    overflow:hidden;
    text-overflow:ellipsis;
  }
  .g-cell input[type=number]{
    width:100%;
    min-width:0;
    padding:6px 4px;
    border:1px solid var(--line);
    border-radius:4px;
    font-size:0.85rem;
    text-align:center;
  }
  .g-cell.placeholder{
    display:flex;
    align-items:flex-end;
    justify-content:center;
  }
  .g-cell.placeholder .ph-box{
    width:100%;
    padding:6px 4px;
    border:1px dashed var(--line);
    border-radius:4px;
    font-size:0.68rem;
    color:#a39d8c;
    text-align:center;
    background:#f2f0e8;
  }

  .error{
    color:var(--danger-dark);
    font-size:0.82rem;
    margin-top:4px;
    min-height:1em;
  }

  .calc-bar{margin:18px 0 6px;}

  .action-row{
    display:flex;
    gap:8px;
    margin-top:12px;
  }
  .action-row button{
    flex:1;
    font-size:0.85rem;
    padding:9px 10px;
  }
  .btn-calc-small{background:var(--ink);color:#fff;}
  .btn-calc-small:hover{background:#000;}
  .btn-clear-small{background:var(--danger);color:#fff;}
  .btn-clear-small:hover{background:var(--danger-dark);}

  /* ---------- 結果 ---------- */
  .card{
    background:var(--cell);
    border:1px solid var(--line);
    border-radius:6px;
    padding:16px 14px 18px;
    margin-top:16px;
  }
  .card h2{font-size:1rem;margin:0 0 10px;color:var(--ink);}
  .hidden{display:none;}

  table{
    width:100%;
    border-collapse:collapse;
    font-size:0.8rem;
  }
  th,td{
    border:1px solid var(--line);
    padding:6px 4px;
    text-align:center;
  }
  th{background:#eee8d8;color:var(--accent-dark);}
  td.product-name{
    text-align:left;
    font-weight:600;
    font-size:0.75rem;
  }
  tr.p1-row td.product-name{color:var(--accent-dark);}
  tr.p2-row td.product-name{color:var(--accent2-dark);}
  tr.last-row{background:#fbf3ea;}
  .usage-last{
    color:#c0392b;
    font-weight:700;
  }

  .note{
    font-size:0.75rem;
    color:#7a7263;
    margin-top:10px;
  }
</style>
</head>
<body>

<div class="fixed-clear">
  <button class="btn-clear" id="clearAllBtn">全部清除</button>
</div>

<div class="wrap">
  <h1 class="title-cn">原料換算</h1>
  <h1 class="title-en">INON GREEN GRANULES</h1>

  <div class="products-sub">
    <span>品名一：Sodium Copper Chlorophyllin</span>
    <span>品名二：Scopolia Extract</span>
  </div>

  <!-- ============ 品名一 ============ -->
  <section class="product-card p1" id="product1">
    <h2>品名一：Sodium Copper Chlorophyllin</h2>

    <div class="formula">
      <span>使用量 = 2400 ×</span>
      <span class="frac"><span class="num">4.19</span><span class="den">含量(%)</span></span>
      <span>×</span>
      <span class="frac"><span class="num">100</span><span class="den">100 − 水份(%)</span></span>
    </div>

    <div class="step">
      <div>
        <label for="y1Input">請輸入分析號碼數量</label>
        <input type="number" id="y1Input" min="1" step="1" placeholder="例:3">
      </div>
      <button class="btn-primary" id="y1ConfirmBtn">確定</button>
    </div>

    <div class="groups" id="y1Groups"></div>
    <div class="action-row">
      <button class="btn-calc-small" id="calc1Btn">計算品名一</button>
      <button class="btn-clear-small" id="clear1Btn">清除品名一</button>
    </div>
    <div class="error" id="y1Error"></div>
  </section>

  <!-- ============ 品名二 ============ -->
  <section class="product-card p2" id="product2">
    <h2>品名二：Scopolia Extract</h2>

    <div class="formula">
      <span>使用量 = 1800g ×</span>
      <span class="frac"><span class="num">0.95</span><span class="den">含量(%)</span></span>
    </div>

    <div class="step">
      <div>
        <label for="y2Input">請輸入分析號碼數量</label>
        <input type="number" id="y2Input" min="1" step="1" placeholder="例:2">
      </div>
      <button class="btn-primary2" id="y2ConfirmBtn">確定</button>
    </div>

    <div class="groups" id="y2Groups"></div>
    <div class="action-row">
      <button class="btn-calc-small" id="calc2Btn">計算品名二</button>
      <button class="btn-clear-small" id="clear2Btn">清除品名二</button>
    </div>
    <div class="error" id="y2Error"></div>
  </section>

  <!-- ============ 結果 ============ -->
  <div class="card hidden" id="resultCard">
    <h2>計算結果（兩品名整理）</h2>
    <table>
      <thead>
        <tr>
          <th>品名</th><th>分析號碼</th><th>使用量</th><th>含量</th><th>水份</th><th>標準值</th>
        </tr>
      </thead>
      <tbody id="resultBody"></tbody>
    </table>
    <div class="note">最後一組（標記為橘底）之使用量／標準值為系統自動回推之結果。</div>
  </div>
</div>

<script>
(function(){
  // ---------- 共用工具 ----------
  function getVal(container, className, index){
    const el = container.querySelector(`.${className}[data-i="${index}"]`);
    const raw = el ? el.value.trim() : '';
    if(raw === '') throw new Error('請完整填寫所有欄位後再計算。');
    const num = parseFloat(raw);
    if(isNaN(num)) throw new Error('請輸入有效的數字。');
    return num;
  }

  // =========================================================
  // 品名一：Sodium Copper Chlorophyllin
  // =========================================================
  const y1Input = document.getElementById('y1Input');
  const y1ConfirmBtn = document.getElementById('y1ConfirmBtn');
  const y1Groups = document.getElementById('y1Groups');
  const y1Error = document.getElementById('y1Error');
  let Y1 = 0;

  y1ConfirmBtn.addEventListener('click', function(){
    y1Error.textContent = '';
    const val = parseInt(y1Input.value, 10);
    if(!val || val < 1){
      y1Error.textContent = '請輸入大於等於 1 的整數。';
      return;
    }
    Y1 = val;
    buildGroups(y1Groups, Y1, {
      cols: 3,
      fields: [
        {cls:'usage-input', label:'使用量'},
        {cls:'content-input', label:'含量%'},
        {cls:'water-input', label:'水份%'}
      ],
      lastFields: [
        {placeholder:true, label:'使用量'},
        {cls:'content-input', label:'含量%'},
        {cls:'water-input', label:'水份%'}
      ]
    });
    y1Input.disabled = true;
    y1ConfirmBtn.disabled = true;
  });

  function calcProduct1(){
    if(Y1 < 1) throw new Error('請先產生品名一的輸入欄位。');
    const a = [];
    for(let i=0;i<Y1;i++) a.push({usage:0, content:0, water:0, std:0});

    for(let i=0;i<Y1-1;i++){
      a[i].usage = getVal(y1Groups,'usage-input', i);
      a[i].content = getVal(y1Groups,'content-input', i);
      a[i].water = getVal(y1Groups,'water-input', i);
    }
    const last = Y1-1;
    a[last].content = getVal(y1Groups,'content-input', last);
    a[last].water = getVal(y1Groups,'water-input', last);

    let sum = 0;
    for(let i=0;i<Y1-1;i++){
      a[i].std = a[i].usage * ((100 - a[i].water)/100) * (a[i].content/4.19);
      sum += a[i].std;
    }
    a[last].std = 2400 - sum;
    a[last].usage = a[last].std * (4.19/a[last].content) * (100/(100-a[last].water));

    return a;
  }

  // =========================================================
  // 品名二：Scopolia Extract
  // =========================================================
  const y2Input = document.getElementById('y2Input');
  const y2ConfirmBtn = document.getElementById('y2ConfirmBtn');
  const y2Groups = document.getElementById('y2Groups');
  const y2Error = document.getElementById('y2Error');
  let Y2 = 0;

  y2ConfirmBtn.addEventListener('click', function(){
    y2Error.textContent = '';
    const val = parseInt(y2Input.value, 10);
    if(!val || val < 1){
      y2Error.textContent = '請輸入大於等於 1 的整數。';
      return;
    }
    Y2 = val;
    buildGroups(y2Groups, Y2, {
      cols: 2,
      fields: [
        {cls:'usage-input', label:'使用量'},
        {cls:'content-input', label:'含量%'}
      ],
      lastFields: [
        {placeholder:true, label:'使用量'},
        {cls:'content-input', label:'含量%'}
      ]
    });
    y2Input.disabled = true;
    y2ConfirmBtn.disabled = true;
  });

  function calcProduct2(){
    if(Y2 < 1) throw new Error('請先產生品名二的輸入欄位。');
    const c = [];
    for(let i=0;i<Y2;i++) c.push({usage:0, content:0, std:0});

    for(let i=0;i<Y2-1;i++){
      c[i].usage = getVal(y2Groups,'usage-input', i);
      c[i].content = getVal(y2Groups,'content-input', i);
    }
    const last = Y2-1;
    c[last].content = getVal(y2Groups,'content-input', last);

    let sum = 0;
    for(let i=0;i<Y2-1;i++){
      c[i].std = c[i].usage * (c[i].content/0.95);
      sum += c[i].std;
    }
    c[last].std = 1800 - sum;
    c[last].usage = c[last].std * (0.95/c[last].content);

    return c;
  }

  // =========================================================
  // 共用：動態產生值組欄位
  // =========================================================
  function buildGroups(container, count, opts){
    container.innerHTML = '';
    for(let i=0;i<count;i++){
      const isLast = (i === count-1);
      const row = document.createElement('div');
      row.className = 'group-row' + (isLast ? ' is-last' : '');

      const labelText = isLast
        ? `第 ${i+1} 組（最後一組，使用量自動回推）`
        : `第 ${i+1} 組`;
      const label = document.createElement('div');
      label.className = 'g-label';
      label.textContent = labelText;
      row.appendChild(label);

      const grid = document.createElement('div');
      grid.className = `g-grid cols-${opts.cols}`;

      const fieldsToUse = isLast ? opts.lastFields : opts.fields;

      fieldsToUse.forEach(f => {
        const cell = document.createElement('div');
        cell.className = 'g-cell' + (f.placeholder ? ' placeholder' : '');

        if(f.placeholder){
          cell.innerHTML = `<div class="ph-box">自動</div>`;
        } else {
          cell.innerHTML = `
            <label>${f.label}</label>
            <input type="number" step="any" class="${f.cls}" data-i="${i}">
          `;
        }
        grid.appendChild(cell);
      });

      row.appendChild(grid);
      container.appendChild(row);
    }
  }

  // =========================================================
  // 結果狀態與合併表格渲染
  // =========================================================
  const resultCard = document.getElementById('resultCard');
  const resultBody = document.getElementById('resultBody');

  // 分別存放兩品名各自的計算結果；哪個品名還沒算過就是 null，
  // 這樣可以只算一個品名，也可以兩個都算，表格會自動合併顯示。
  const resultsState = { p1: null, p2: null };

  function renderResults(){
    let rows = '';

    if(resultsState.p1){
      resultsState.p1.forEach((row, i) => {
        const isLast = (i === resultsState.p1.length-1);
        rows += `
          <tr class="p1-row${isLast ? ' last-row' : ''}">
            <td class="product-name">${i===0 ? 'Sodium Copper<br>Chlorophyllin' : ''}</td>
            <td>${i+1}</td>
            <td>${isLast ? `<span class="usage-last">${row.usage.toFixed(2)}</span>` : row.usage.toFixed(3)}</td>
            <td>${row.content.toFixed(2)}</td>
            <td>${row.water.toFixed(2)}</td>
            <td>${row.std.toFixed(2)}</td>
          </tr>
        `;
      });
    }

    if(resultsState.p2){
      resultsState.p2.forEach((row, i) => {
        const isLast = (i === resultsState.p2.length-1);
        rows += `
          <tr class="p2-row${isLast ? ' last-row' : ''}">
            <td class="product-name">${i===0 ? 'Scopolia<br>Extract' : ''}</td>
            <td>${i+1}</td>
            <td>${isLast ? `<span class="usage-last">${row.usage.toFixed(2)}</span>` : row.usage.toFixed(3)}</td>
            <td>${row.content.toFixed(2)}</td>
            <td>—</td>
            <td>${row.std.toFixed(2)}</td>
          </tr>
        `;
      });
    }

    resultBody.innerHTML = rows;
    if(resultsState.p1 || resultsState.p2){
      resultCard.classList.remove('hidden');
    } else {
      resultCard.classList.add('hidden');
    }
  }

  // ---------- 品名一：計算 / 清除 ----------
  const calc1Btn = document.getElementById('calc1Btn');
  const clear1Btn = document.getElementById('clear1Btn');

  calc1Btn.addEventListener('click', function(){
    y1Error.textContent = '';
    try{
      resultsState.p1 = calcProduct1();
      renderResults();
    } catch(err){
      y1Error.textContent = err.message || '輸入有誤，請檢查品名一的所有欄位是否已填寫且為有效數字。';
    }
  });

  // 清除品名一：邏輯重點
  // 1. 重設品名一的 Y 值、輸入框與確定鍵狀態，回到最初步驟。
  // 2. 清空品名一動態產生的值組欄位。
  // 3. 清空品名一的錯誤訊息。
  // 4. 把 resultsState.p1 設回 null，並重新渲染結果表（品名二若已算過會保留）。
  // 5. 焦點移回品名一的分析號碼數量輸入框。
  clear1Btn.addEventListener('click', function(){
    Y1 = 0;
    y1Input.value = '';
    y1Input.disabled = false;
    y1ConfirmBtn.disabled = false;
    y1Groups.innerHTML = '';
    y1Error.textContent = '';

    resultsState.p1 = null;
    renderResults();

    y1Input.focus();
  });

  // ---------- 品名二：計算 / 清除 ----------
  const calc2Btn = document.getElementById('calc2Btn');
  const clear2Btn = document.getElementById('clear2Btn');

  calc2Btn.addEventListener('click', function(){
    y2Error.textContent = '';
    try{
      resultsState.p2 = calcProduct2();
      renderResults();
    } catch(err){
      y2Error.textContent = err.message || '輸入有誤，請檢查品名二的所有欄位是否已填寫且為有效數字。';
    }
  });

  // 清除品名二：邏輯與品名一對稱，只重設品名二自己的狀態，
  // 不影響品名一已產生的欄位或已算出的結果。
  clear2Btn.addEventListener('click', function(){
    Y2 = 0;
    y2Input.value = '';
    y2Input.disabled = false;
    y2ConfirmBtn.disabled = false;
    y2Groups.innerHTML = '';
    y2Error.textContent = '';

    resultsState.p2 = null;
    renderResults();

    y2Input.focus();
  });

  // =========================================================
  // 全部清除（同時清空兩品名）
  // =========================================================
  // 邏輯重點：
  // 1. 重設兩個品名各自的 Y 值、輸入框與確定鍵狀態，回到最初步驟。
  // 2. 清空兩品名所有動態產生的值組欄位。
  // 3. 清空兩品名的錯誤訊息。
  // 4. 兩品名的結果狀態都設回 null，隱藏並清空結果表格。
  // 5. 焦點移回品名一的分析號碼數量輸入框，方便下一次輸入。
  const clearAllBtn = document.getElementById('clearAllBtn');
  clearAllBtn.addEventListener('click', function(){
    // 品名一
    Y1 = 0;
    y1Input.value = '';
    y1Input.disabled = false;
    y1ConfirmBtn.disabled = false;
    y1Groups.innerHTML = '';
    y1Error.textContent = '';

    // 品名二
    Y2 = 0;
    y2Input.value = '';
    y2Input.disabled = false;
    y2ConfirmBtn.disabled = false;
    y2Groups.innerHTML = '';
    y2Error.textContent = '';

    // 計算結果
    resultsState.p1 = null;
    resultsState.p2 = null;
    renderResults();

    y1Input.focus();
  });
})();
</script>

</body>
</html>
